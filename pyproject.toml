[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-digitization"
version = "0.1.0"
description = "Production-grade pipeline for digitizing paper/scanned ECG images into WFDB time-series signals."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["ecg", "digitization", "medical-imaging", "deep-learning", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecg_digitization = ["py.typed"]

# ==============================================================================
# Formatting
# ==============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ecg_digitization"]

# ==============================================================================
# Linting
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ==============================================================================
# Type checking
# ==============================================================================
[tool.mypy]
python_version = "3.11"
packages = ["ecg_digitization"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# ==============================================================================
# Testing
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=ecg_digitization --cov-report=term-missing"
markers = [
    "unit: fast, no I/O, no GPU required",
    "integration: exercises multiple modules together",
    "slow: long-running tests, excluded from default CI run",
]

[tool.coverage.run]
source = ["src/ecg_digitization"]
omit = ["*/tests/*"]
